# The API is intentionally NOT containerized: its diagnostics must run against
# the host (docker, systemctl, journalctl). Run it on the host instead:
#   cd backend && .venv/bin/uvicorn app.main:app --port 8000
# To run a degraded containerized API anyway: docker compose --profile container up
services:
  api:
    profiles: ["container"]
    build: ../backend
    ports: ["8000:8000"]
    env_file:
      - path: ../.env
        required: false
    environment:
      - APP_ENV=development
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ../backend/app:/app/app
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ../frontend:/app
      - web_node_modules:/app/node_modules

volumes:
  web_node_modules:
