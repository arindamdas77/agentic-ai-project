services:
  api:
    build: ../backend
    ports: ["8000:8000"]
    environment:
      - APP_ENV=development
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ../backend/app:/app/app
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ../frontend:/app
      - web_node_modules:/app/node_modules
    depends_on: [api]

volumes:
  web_node_modules:
